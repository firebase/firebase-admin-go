name: Continuous Integration
on: pull_request
jobs:

  check_base_branch:
    name: Check base branch
    runs-on: ubuntu-latest
    steps:
    - name: Verify target branch is dev
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [[ "${BASE_REF}" != "dev" ]]; then
          echo "::error title=Invalid Base Branch::Pull requests must target the 'dev' branch (currently targeting '${BASE_REF}'). Please edit this PR to change the base branch to 'dev'."
          exit 1
        fi

  module:
    name: Module build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}

    - name: Install golint
      run: go install golang.org/x/lint/golint@latest

    - name: Run Linter
      run: |
        golint -set_exit_status ./...

    - name: Run Unit Tests
      if: success() || failure()
      run: go test -v -race -test.short ./...

    - name: Run Formatter
      run: |
        if [[ ! -z "$(gofmt -l -s .)" ]]; then
          echo "Go code is not formatted:"
          gofmt -d -s .
          exit 1
        fi

    - name: Run Static Analyzer
      run: go vet -v ./...
